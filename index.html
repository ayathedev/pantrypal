
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PantryPal - Smart Meal Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes revealStep {
        from {
          opacity: 0;
          transform: translateY(15px);
          scale: 0.98;
        }
        to {
          opacity: 1;
          transform: translateY(0);
          scale: 1;
        }
      }

      .animate-card-entry {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Fancy Grid Expansion Animation */
      .expand-grid {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .expand-grid.is-open {
        grid-template-rows: 1fr;
      }

      .expand-inner {
        overflow: hidden;
      }

      /* Re-triggering reveal animations when parent becomes open */
      .is-open .animate-reveal-step {
        animation: revealStep 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
    </style>

</script>
</head>

  </body>
</html>
